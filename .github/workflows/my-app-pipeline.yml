name: CI

on:
  push:
    branches: ["elamCano_p1_dev"]
  pull_request:
    branches: ["elamCano_p1_dev"]
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      # Build
      - name: Build
        run: dotnet build --no-restore

      # Test
      - name: Run tests with coverage
        run: dotnet test ./myApp.Tests --collect:"XPlat Code Coverage"

      # Find coverage report path
      - name: Find coverage report path
        id: find_coverage
        shell: pwsh
        run: |
          # Buscar el archivo de cobertura
          $file = Get-ChildItem -Path ./myApp.Tests/TestResults -Recurse -Filter "coverage.cobertura.xml" | Select-Object -First 1
          if ($file -eq $null) {
            Write-Error "No coverage file found"
            exit 1
          }
          echo "Found: $($file.FullName)"
          echo "##[set-output name=coverage_path]$($file.FullName)"

      # Install ReportGenerator
      - name: Install ReportGenerator
        run: dotnet tool install dotnet-reportgenerator-globaltool --tool-path tools

      # Generate coverage report
      - name: Generate coverage report
        run:
          ./tools/reportgenerator.exe -reports:${{ steps.find_coverage.outputs.coverage_path }} -targetdir:./myApp.Tests/reports/coveragereport -reporttypes:Html

          # Validate code coverage
      - name: Validate code coverage
        run: ./scripts/validate_coverage.ps1
        shell: pwsh
        env:
          COVERAGE_PATH: ${{ steps.find_coverage.outputs.coverage_path }}

      # Generate artifact
      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./myApp.Tests/reports/coveragereport

      # Publish
      - name: Publish app
        run: dotnet publish ./myApp -c Release -o ./publish
